[project]
name = "denselinkage"
version = "0.1.0"
description = "Record linkage with dense blocking using text embeddings and LLM matching"
readme = "README.md"
authors = [
    { name = "Alvaro", email = "alvarocarvalho@live.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["record-linkage", "entity-resolution", "embeddings", "blocking", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# Core stays light: numpy (vectors) + pandas (the tabular IO layer). Heavy ML
# backends are optional extras so the core installs dependency-free of them.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/caalvaro/denselinkage"
Repository = "https://github.com/caalvaro/denselinkage"
Issues = "https://github.com/caalvaro/denselinkage/issues"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3", "langchain-openai>=0.2"]
faiss = ["faiss-cpu>=1.8"]
sentence-transformers = ["sentence-transformers>=3.0"]
# Reserved for v2 trainers (EmbedderTrainer / CrossEncoderTrainer). The
# `denselinkage.training` namespace is reserved now; intentionally empty in
# v1 so the import path and extra name are stable. v2 fills this with
# torch / transformers / sentence-transformers.
train = []
all = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8",
    "pytest-cov>=5",
    "pandas-stubs>=2.0",
]
# Documentation toolchain (Sphinx site -> GitHub Pages). Docs-only, never
# imported by the package. The API reference is autodoc-generated, and the
# package's lazy-import discipline means the build needs no heavy extras.
docs = [
    "sphinx>=8",
    "furo>=2024.8",
    "myst-parser>=4",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinxcontrib-mermaid>=0.9",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["denselinkage"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
# Structure stage: bodies are `...` placeholders by design, so the strict
# `empty-body` check is intentionally off until implementations land. Every
# other strict check stays on (signatures/types are the contract).
disable_error_code = ["empty-body"]
# numpy ships py.typed; pandas types come from pandas-stubs (dev). Optional
# heavy adapters that lack stubs are tolerated — both the package and its
# submodules, so `mypy src/ examples/` resolves the examples' heavy imports
# (e.g. `from langchain_openai import ChatOpenAI`) with no extras installed.
[[tool.mypy.overrides]]
module = [
    "faiss",
    "faiss.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "langchain_openai",
    "langchain_openai.*",
    "langchain_core",
    "langchain_core.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "adapter: requires an optional heavy adapter (faiss / sentence-transformers / langchain)",
    "slow: long-running test",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# Branch coverage is enforced. The dependency-free surface is fully exercised by
# the `not adapter and not slow` selection the CI coverage job runs; revisit this
# threshold when adapter-only bodies (faiss / sentence-transformers / langchain)
# land, since their tests are `adapter`-marked and excluded from that run.
fail_under = 100
show_missing = true
