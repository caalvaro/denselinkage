[project]
name = "denselinkage"
version = "1.0.0"
description = "Record linkage with dense blocking using text embeddings and LLM matching"
readme = "README.md"
authors = [
    { name = "Alvaro", email = "alvarocarvalho@live.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["record-linkage", "entity-resolution", "embeddings", "blocking", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# Core stays light: numpy (vectors) + pandas (the tabular IO layer). Heavy ML
# backends are optional extras so the core installs dependency-free of them.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.urls]
Homepage = "https://github.com/caalvaro/denselinkage"
Documentation = "https://caalvaro.github.io/denselinkage/"
Repository = "https://github.com/caalvaro/denselinkage"
Issues = "https://github.com/caalvaro/denselinkage/issues"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3", "langchain-openai>=0.2"]
faiss = ["faiss-cpu>=1.8"]
sentence-transformers = ["sentence-transformers>=3.0"]
# Reserved for v2 trainers (EmbedderTrainer / CrossEncoderTrainer). The
# `denselinkage.training` namespace is reserved now; intentionally empty in
# v1 so the import path and extra name are stable. v2 fills this with
# torch / transformers / sentence-transformers.
train = []
all = [
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
    "pytest>=8",
    "pytest-cov>=5",
    "pandas-stubs>=2.0",
]
# Documentation toolchain (Sphinx site -> GitHub Pages). Docs-only, never
# imported by the package. The API reference is autodoc-generated, and the
# package's lazy-import discipline means the build needs no heavy extras.
docs = [
    "sphinx>=8",
    "furo>=2024.8",
    "myst-parser>=4",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
    "sphinxcontrib-mermaid>=0.9",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.12"]
build-backend = "uv_build"

# The uv version floor, not the CI pin. uv.lock fixes the dependency set, but it
# fixes a *run* only if the tool reading it is fixed too, so each setup-uv step
# in .github/workflows/ pins `version: "0.11.9"` exactly. This floor stays a
# range on purpose: `required-version` is enforced on every local uv invocation,
# and an exact pin here would block a contributor whose uv is merely newer.
# Raise it only when the lockfile format requires it, and re-run `uv lock` in
# the same change.
[tool.uv]
required-version = ">=0.11.9"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["denselinkage"]

[tool.mypy]
# Type-check against the oldest supported interpreter, matching `requires-python`
# above and ruff's `target-version`, so a 3.11+ construct in `src/` or
# `examples/` fails here rather than on a user's 3.10. The 3.12 target was a
# stopgap for CI floating to numpy 2.5.1, whose stubs use PEP 695 `type` aliases
# that a pre-3.12 target cannot parse (issue #9). CI now installs from uv.lock,
# which pins numpy 2.2.6 below 3.11 and 2.4.6 above, and neither ships those
# aliases. The target is only half the story: the stub *set* comes from the
# installed environment, so the same error can exist under one numpy and not the
# other. The `test` job therefore re-runs `mypy --python-version=3.10` on its
# 3.10 leg, the only environment in CI that installs numpy 2.2.6.
python_version = "3.10"
files = ["src"]
strict = true
# The `Protocol` port methods in `core/ports.py` are `...` by design, so the
# strict `empty-body` check is intentionally off. Every other strict check stays
# on (signatures/types are the contract).
disable_error_code = ["empty-body"]
# numpy ships py.typed; pandas types come from pandas-stubs (dev). Optional
# heavy adapters that lack stubs are tolerated — both the package and its
# submodules, so `mypy src/ examples/` resolves the examples' heavy imports
# (e.g. `from langchain_openai import ChatOpenAI`) with no extras installed.
[[tool.mypy.overrides]]
module = [
    "faiss",
    "faiss.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "langchain_openai",
    "langchain_openai.*",
    "langchain_core",
    "langchain_core.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Repo root on the path so the frozen-surface gate can import its derivation as
# `tests._api_snapshot`, the same name its regeneration entry point is invoked
# under (`python -m tests._api_snapshot`). Without it pytest puts only `tests/`
# on the path and the two names would diverge.
pythonpath = ["."]
markers = [
    "adapter: requires an optional heavy adapter (faiss / sentence-transformers / langchain)",
    "slow: long-running test",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
# Branch coverage is enforced on the dependency-free surface, which the
# `not adapter and not slow` CI selection fully exercises. The heavy-adapter
# modules are `omit`ted here: their backend-touching bodies run only under the
# `adapter`-marked tests (excluded from that selection), so the dedicated
# `adapter-tests` CI job installs the extras and gates their coverage instead.
# See ADR-0005 (the ADR-0004 D-4.7 revisit).
fail_under = 100
show_missing = true
omit = [
    "*/denselinkage/embedding/sentence_transformer_embedder.py",
    "*/denselinkage/indexing/faiss_flat_index.py",
    "*/denselinkage/indexing/faiss_searchable_index.py",
    "*/denselinkage/matching/langchain_matcher.py",
]
