# Run: uv run pre-commit install   (then hooks run on every commit)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # check-yaml / check-toml are disabled: Windows Smart App Control (enforced)
      # blocks their compiled dependency (ruamel.yaml.clib) from running locally
      # [WinError 4551]. The files are still validated elsewhere — GitHub parses
      # the workflow YAML on push, the build consumes pyproject.toml, and both
      # load cleanly via `python -m tomllib` / a YAML pass. Re-enable if SAC is off.
      # - id: check-yaml
      # - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
