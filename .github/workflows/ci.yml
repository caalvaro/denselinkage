name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install --upgrade uv
      - name: Install project (dev extras)
        run: uv pip install --system -e ".[dev]"
      # `.claude/hooks/` is in scope: those two scripts gate every agent edit,
      # and nothing else checks them.
      - name: Ruff lint (src, tests, examples, hooks)
        run: ruff check src/ tests/ examples/ .claude/hooks/
      - name: Ruff format check
        run: ruff format --check src/ tests/ examples/ .claude/hooks/
      - name: Mypy (src + examples + hooks; examples are the spec)
        run: mypy src/ examples/ .claude/hooks/
      - name: Compile examples
        run: python -m compileall examples
      - name: Run dependency-free examples
        # Smoke-run (crash detection) on this job's interpreter only; result
        # correctness is asserted by the unit tests across the 3.10-3.13 matrix.
        # 01/02 use the heavy extras + a live LLM, so they are type-checked and
        # compiled (above) but not executed here; the rest run end to end on
        # numpy + pandas alone.
        run: |
          python examples/00_quickstart.py
          python examples/03_custom_embedder.py
          python examples/04_dedupe.py
          python examples/05_failure_accounting.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install --upgrade uv
      # Cache the FAISS wheel across runs. (The sentence-transformers model is
      # cached in the `adapter-tests` job, the only one that downloads it.)
      - name: Cache pip wheels
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
      - name: Install (dev + faiss extras, without LLM keys)
        run: uv pip install --system -e ".[dev,faiss]"
      - name: Run unit + integration tests
        # Use ``and`` (not ``or``): "not adapter or not slow" is true for
        # every test that isn't slow, including unmarked adapter tests,
        # which would then run in CI without an OpenAI key.
        run: pytest -m "not adapter and not slow" --cov=denselinkage --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          fail_ci_if_error: false

  adapter-tests:
    name: Adapter tests (heavy extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install --upgrade uv
      - name: Cache pip wheels
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-adapters-${{ hashFiles('pyproject.toml') }}
      - name: Cache the sentence-transformers model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-${{ runner.os }}
      - name: Install (dev + all heavy extras)
        run: uv pip install --system -e ".[dev,faiss,sentence-transformers,langchain]"
      - name: Run adapter tests with adapter-scoped 100% coverage
        # The heavy-adapter bodies are omitted from the dependency-free gate
        # (ADR-0005); gate them here at 100% via .coveragerc.adapter, on the job
        # that can import their backends. The LangChain tests use a fake LLM, so
        # no API key is needed.
        run: >
          pytest -m "adapter"
          --cov=denselinkage
          --cov-config=.coveragerc.adapter
          --cov-report=term-missing

  core-only:
    name: Core only (no extras — dependency-cut proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install --upgrade uv
      - name: Install core + dev ONLY (no faiss / st / langchain)
        run: uv pip install --system -e ".[dev]"
      - name: Assert no heavy backend is importable
        run: |
          python - <<'PY'
          import importlib.util as u
          for m in ("faiss", "sentence_transformers", "langchain_core", "langchain_openai", "torch"):
              assert u.find_spec(m) is None, f"{m} leaked into the core env"
          PY
      - name: Import + non-adapter tests with zero extras
        run: |
          python -c "import sys, denselinkage; assert not {'faiss','sentence_transformers','langchain_core'} & sys.modules.keys()"
          pytest -m "not adapter and not slow"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint-and-type, test, core-only, adapter-tests]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
