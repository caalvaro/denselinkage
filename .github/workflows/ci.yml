name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type:
    name: Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install --upgrade uv
      - name: Install project (dev extras)
        run: uv pip install --system -e ".[dev]"
      - name: Ruff
        run: ruff check src/ tests/
      - name: Mypy
        run: mypy src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install --upgrade uv
      # Cache the FAISS / sentence-transformers downloads across runs.
      - name: Cache pip wheels
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
      - name: Cache sentence-transformers models
        uses: actions/cache@v5
        with:
          path: ~/.cache/torch/sentence_transformers
          key: st-models-${{ runner.os }}
      - name: Install (dev + faiss extras, without LLM keys)
        run: uv pip install --system -e ".[dev,faiss]"
      - name: Run unit + integration tests
        # Use ``and`` (not ``or``): "not adapter or not slow" is true for
        # every test that isn't slow, including unmarked adapter tests,
        # which would then run in CI without an OpenAI key.
        run: pytest -m "not adapter and not slow" --cov=denselinkage --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          fail_ci_if_error: false

  core-only:
    name: Core only (no extras — dependency-cut proof)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install --upgrade uv
      - name: Install core + dev ONLY (no faiss / st / langchain)
        run: uv pip install --system -e ".[dev]"
      - name: Assert no heavy backend is importable
        run: |
          python - <<'PY'
          import importlib.util as u
          for m in ("faiss", "sentence_transformers", "langchain_core", "langchain_openai", "torch"):
              assert u.find_spec(m) is None, f"{m} leaked into the core env"
          PY
      - name: Import + non-adapter tests with zero extras
        run: |
          python -c "import sys, denselinkage; assert not {'faiss','sentence_transformers','langchain_core'} & sys.modules.keys()"
          pytest -m "not adapter and not slow"

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint-and-type, test, core-only]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
