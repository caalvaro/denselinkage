name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress Pages deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install --upgrade uv
      # Core deps (numpy + pandas) come in transitively; heavy extras are NOT
      # needed — the package's lazy-import discipline lets autodoc import every
      # adapter without faiss / sentence-transformers / langchain installed.
      - name: Install project + docs extra
        run: uv pip install --system -e ".[docs]"
      - name: Build HTML (warnings are errors)
        run: sphinx-build -b html -W --keep-going docs docs/_build/html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Build on every push/PR (catches breakage), but only publish from main.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
