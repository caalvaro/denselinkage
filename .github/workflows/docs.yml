name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress Pages deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

# See ci.yml: `uv run` re-syncs by default, so UV_NO_SYNC turns that off and the
# sphinx-build step uses exactly what `uv sync --locked` installed.
env:
  UV_NO_SYNC: "1"

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0
        with:
          version: "0.11.9"
          python-version: "3.12"
          enable-cache: true
          cache-suffix: docs
      # Core deps (numpy + pandas) come in transitively; heavy extras are NOT
      # needed — the package's lazy-import discipline lets autodoc import every
      # adapter without faiss / sentence-transformers / langchain installed.
      - name: Sync the locked environment (docs extra)
        run: uv sync --locked --extra docs
      - name: Build HTML (warnings are errors)
        run: uv run sphinx-build -b html -W --keep-going docs docs/_build/html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Build on every push/PR (catches breakage), but only publish from main.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
